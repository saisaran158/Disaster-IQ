server.port=8071
spring.application.name=gateway-server

# Service Discovery (Eureka Client)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Routing config mapping gateway calls to the appropriate microservices
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=lb://identity-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/**,/api/teacher/**,/api/parent/**,/api/teachers/**,/api/students/**,/api/student/dashboard/**

spring.cloud.gateway.routes[1].id=school-service
spring.cloud.gateway.routes[1].uri=lb://school-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/schools/**,/api/classes/**

spring.cloud.gateway.routes[2].id=simulation-service
spring.cloud.gateway.routes[2].uri=lb://simulation-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/simulations/**,/api/assignments/**,/api/assessments/**,/api/questions/**,/api/options/**

# Global CORS configurations (allows gateway to handle preflight)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Student assessment engine routes (handled by simulation-service)
spring.cloud.gateway.routes[3].id=simulation-service-student
spring.cloud.gateway.routes[3].uri=lb://simulation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/student/assessment/**
